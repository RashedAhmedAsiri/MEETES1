# Records every line Barem speaks with Microsoft Edge's neural Saudi voice (edge-tts) and
# commits the clips (game/voice/*.mp3) and the clip map (game/js/voice-files.js) to the branch.
# Runs when the voice tools or the game's text change, or by hand from the Actions tab.
name: Record voice
on:
  push:
    paths:
      - 'tools/voice/**'
      - 'game/js/content.js'
      - '.github/workflows/voice.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice-${{ github.ref }}
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts==7.2.8
      - name: Record the clips
        run: python3 tools/voice/make_voice.py
      - name: Commit the clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/voice game/js/voice-files.js
          if git diff --cached --quiet; then echo "no new clips"; exit 0; fi
          git commit -m "Record voice clips with Edge TTS (ar-SA-ZariyahNeural)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
